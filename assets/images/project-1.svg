<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFE0" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg1)" />

  <!-- Grid lines subtle -->
  <g opacity="0.15" stroke="#00FFE0" stroke-width="0.75" stroke-dasharray="4 4">
    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="240" y1="0" x2="240" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="560" y1="0" x2="560" y2="500" />
    <line x1="720" y1="0" x2="720" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Glow Orb -->
  <circle cx="650" cy="150" r="140" fill="#00FFE0" opacity="0.18" filter="url(#glow1)" />
  <circle cx="200" cy="380" r="160" fill="#2563EB" opacity="0.12" filter="url(#glow1)" />

  <!-- App Window Mockup -->
  <rect x="70" y="60" width="660" height="380" rx="16" fill="#141824" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="70" y="60" width="660" height="42" rx="16" fill="#191e2e" />
  <circle cx="95" cy="81" r="5" fill="#EF4444" />
  <circle cx="112" cy="81" r="5" fill="#F59E0B" />
  <circle cx="129" cy="81" r="5" fill="#10B981" />
  <rect x="160" y="73" width="180" height="16" rx="8" fill="rgba(255,255,255,0.08)" />

  <!-- Sidebar -->
  <rect x="70" y="102" width="140" height="338" fill="#121622" />
  <rect x="90" y="125" width="100" height="12" rx="4" fill="url(#cyanGlow)" />
  <rect x="90" y="155" width="80" height="10" rx="4" fill="rgba(255,255,255,0.2)" />
  <rect x="90" y="180" width="90" height="10" rx="4" fill="rgba(255,255,255,0.2)" />
  <rect x="90" y="205" width="75" height="10" rx="4" fill="rgba(255,255,255,0.2)" />

  <!-- Main Content Dashboard -->
  <!-- Stats Cards -->
  <rect x="230" y="125" width="145" height="75" rx="10" fill="#191f30" stroke="rgba(0,255,224,0.3)" />
  <text x="245" y="150" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="bold">TOTAL VOLUME</text>
  <text x="245" y="180" fill="#00FFE0" font-family="sans-serif" font-size="20" font-weight="900">$2.48M</text>

  <rect x="390" y="125" width="145" height="75" rx="10" fill="#191f30" stroke="rgba(255,255,255,0.08)" />
  <text x="405" y="150" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="bold">TRANSACTIONS</text>
  <text x="405" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="900">184,920</text>

  <rect x="550" y="125" width="160" height="75" rx="10" fill="#191f30" stroke="rgba(255,255,255,0.08)" />
  <text x="565" y="150" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="bold">ACTIVE APIS</text>
  <text x="565" y="180" fill="#38BDF8" font-family="sans-serif" font-size="20" font-weight="900">99.98%</text>

  <!-- Chart Area -->
  <rect x="230" y="220" width="480" height="200" rx="12" fill="#171c2b" stroke="rgba(255,255,255,0.06)" />
  <path d="M 250 380 Q 320 330, 380 340 T 480 290 T 580 260 T 680 240" fill="none" stroke="url(#cyanGlow)" stroke-width="4" filter="url(#glow1)" />
  <path d="M 250 380 Q 320 330, 380 340 T 480 290 T 580 260 T 680 240 L 680 400 L 250 400 Z" fill="url(#cyanGlow)" opacity="0.08" />

  <!-- Data points -->
  <circle cx="480" cy="290" r="5" fill="#00FFE0" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="580" cy="260" r="5" fill="#00FFE0" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="680" cy="240" r="6" fill="#00FFE0" stroke="#FFFFFF" stroke-width="2.5" />
</svg>
