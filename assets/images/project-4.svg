<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFE0" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)" />

  <!-- Node network lines -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 4">
    <line x1="200" y1="250" x2="400" y2="170" />
    <line x1="200" y1="250" x2="400" y2="330" />
    <line x1="400" y1="170" x2="600" y2="250" />
    <line x1="400" y1="330" x2="600" y2="250" />
  </g>

  <!-- Animated-like Flow Path -->
  <path d="M 200 250 Q 300 170 400 170 T 600 250" fill="none" stroke="url(#pulseGrad)" stroke-width="4" filter="url(#glow4)" />

  <!-- Node 1: Input -->
  <g transform="translate(140, 210)">
    <rect width="120" height="80" rx="12" fill="#141829" stroke="#00FFE0" stroke-width="1.5" />
    <circle cx="28" cy="40" r="14" fill="rgba(0,255,224,0.15)" />
    <circle cx="28" cy="40" r="6" fill="#00FFE0" />
    <text x="52" y="37" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">INPUT</text>
    <text x="52" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Trigger API</text>
  </g>

  <!-- Node 2: Processing Top -->
  <g transform="translate(340, 130)">
    <rect width="130" height="80" rx="12" fill="#141829" stroke="#8B5CF6" stroke-width="1.5" />
    <circle cx="28" cy="40" r="14" fill="rgba(139,92,246,0.15)" />
    <circle cx="28" cy="40" r="6" fill="#8B5CF6" />
    <text x="52" y="37" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">AGENT</text>
    <text x="52" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">LLM Planner</text>
  </g>

  <!-- Node 3: Processing Bottom -->
  <g transform="translate(340, 290)">
    <rect width="130" height="80" rx="12" fill="#141829" stroke="#FFA800" stroke-width="1.5" />
    <circle cx="28" cy="40" r="14" fill="rgba(255,168,0,0.15)" />
    <circle cx="28" cy="40" r="6" fill="#FFA800" />
    <text x="52" y="37" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">DATA</text>
    <text x="52" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Vector Store</text>
  </g>

  <!-- Node 4: Output Synthesis -->
  <g transform="translate(540, 210)">
    <rect width="130" height="80" rx="12" fill="#141829" stroke="#D4FF00" stroke-width="1.5" />
    <circle cx="28" cy="40" r="14" fill="rgba(212,255,0,0.15)" />
    <circle cx="28" cy="40" r="6" fill="#D4FF00" />
    <text x="52" y="37" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">DISPATCH</text>
    <text x="52" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Live Deploy</text>
  </g>
</svg>
