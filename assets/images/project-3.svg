<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#111622" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)" />

  <!-- Ambient accents -->
  <circle cx="200" cy="150" r="130" fill="#00FFE0" opacity="0.12" filter="url(#glow3)" />
  <circle cx="650" cy="350" r="140" fill="#D4FF00" opacity="0.08" filter="url(#glow3)" />

  <!-- Design System Component Library Visuals -->
  <!-- Floating Component 1: Button system -->
  <g transform="translate(80, 80)">
    <rect width="280" height="150" rx="14" fill="#151a26" stroke="rgba(255,255,255,0.1)" />
    <text x="24" y="38" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700">BUTTON SYSTEM</text>
    <rect x="24" y="58" width="100" height="34" rx="17" fill="#D4FF00" />
    <text x="50" y="80" fill="#000" font-family="sans-serif" font-size="12" font-weight="bold">Primary</text>
    <rect x="138" y="58" width="110" height="34" rx="17" fill="none" stroke="rgba(255,255,255,0.3)" />
    <text x="165" y="80" fill="#FFF" font-family="sans-serif" font-size="12" font-weight="bold">Secondary</text>
    <rect x="24" y="105" width="224" height="24" rx="6" fill="rgba(0,255,224,0.08)" stroke="rgba(0,255,224,0.2)" />
    <text x="75" y="121" fill="#00FFE0" font-family="sans-serif" font-size="11" font-weight="600">tokens.primary.accent</text>
  </g>

  <!-- Floating Component 2: Color Palette Swatches -->
  <g transform="translate(420, 70)">
    <rect width="300" height="170" rx="14" fill="#151a26" stroke="rgba(255,255,255,0.1)" />
    <text x="24" y="36" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700">COLOR TOKENS &amp; SCALES</text>
    <circle cx="50" cy="75" r="22" fill="#00FFE0" />
    <circle cx="110" cy="75" r="22" fill="#3B82F6" />
    <circle cx="170" cy="75" r="22" fill="#FFA800" />
    <circle cx="230" cy="75" r="22" fill="#D4FF00" />
    <text x="24" y="125" fill="#64748B" font-family="sans-serif" font-size="11">50+ accessible contrast-verified design tokens</text>
    <rect x="24" y="138" width="250" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
    <rect x="24" y="138" width="190" height="8" rx="4" fill="#00FFE0" />
  </g>

  <!-- Floating Component 3: Input & Toggle states -->
  <g transform="translate(180, 260)">
    <rect width="440" height="180" rx="14" fill="#141824" stroke="rgba(0,255,224,0.3)" />
    <text x="30" y="36" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="700">INTERACTIVE INPUT FIELD</text>
    <rect x="30" y="55" width="380" height="44" rx="10" fill="#0d1017" stroke="#00FFE0" stroke-width="1.5" />
    <text x="48" y="82" fill="#FFFFFF" font-family="sans-serif" font-size="14">bluex.developer@studio.design</text>
    <rect x="30" y="120" width="56" height="28" rx="14" fill="#00FFE0" />
    <circle cx="68" cy="134" r="10" fill="#0b0e14" />
    <text x="100" y="139" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Dark Mode Active</text>
  </g>
</svg>
