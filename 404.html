<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>BlueX Quantitative Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // GitHub Pages SPA router fallback
    (function() {
      var path = window.location.pathname;
      if (path.indexOf('/login') !== -1) {
        window.location.replace('/login/');
      } else if (path.indexOf('/journal') !== -1) {
        window.location.replace('/journal/');
      } else if (path.indexOf('/dashboard') !== -1 || path.indexOf('/cockpit') !== -1) {
        window.location.replace('/dashboard/sales/');
      } else {
        window.location.replace('/dashboard/sales/');
      }
    })();
  </script>
</head>
<body style="background-color: #060911; color: #f1f5f9; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Redirecting to BlueX Quantitative Terminal...</p>
</body>
</html>
